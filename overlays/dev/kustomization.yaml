apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: secure-gitops-pipeline-dev

resources:
  - ../../base

patches:
  - path: patch-replicas.yaml
    target:
      kind: Deployment
      name: secure-gitops-pipeline

labels:
  - pairs:
      environment: dev
    includeSelectors: true

# Ce bloc est ajouté/mis à jour automatiquement par le CI via :
#   kustomize edit set image myapp=ghcr.io/khaoula-dr/secure-gitops-pipeline:<sha>
# Laissez-le vide (ou absent) au premier commit — le CI le remplira au premier run.
images: []
