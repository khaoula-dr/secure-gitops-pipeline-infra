apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-gitops-pipeline-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/khaoula-dr/secure-gitops-pipeline-infra.git
    targetRevision: main
    path: overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: secure-gitops-pipeline-prod

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
