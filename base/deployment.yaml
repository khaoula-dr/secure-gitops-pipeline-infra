apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-gitops-pipeline
  labels:
    app: secure-gitops-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-gitops-pipeline
  template:
    metadata:
      labels:
        app: secure-gitops-pipeline
    spec:
      automountServiceAccountToken: false  # AJOUT — l'app n'a pas besoin de parler à l'API K8s
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: secure-gitops-pipeline
          image: myapp
          imagePullPolicy: Always  # AJOUT — toujours retirer une image fraîche pour ce tag
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_NAME
              value: secure-gitops-pipeline
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:      # AJOUT
              type: RuntimeDefault  # AJOUT